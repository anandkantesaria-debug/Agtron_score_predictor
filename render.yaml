services:
  - type: web
    name: agtron-predictor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: models/agtron_model.cbm
      - key: PREDICTION_LOG_PATH
        value: logs/predictions.jsonl

