services:
  - type: web
    name: agtron-predictor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: models/agtron_model.cbm
      - key: FEATURE_BOUNDS_PATH
        value: models/feature_bounds.json
      - key: PREDICTION_LOG_PATH
        value: logs/predictions.jsonl
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

